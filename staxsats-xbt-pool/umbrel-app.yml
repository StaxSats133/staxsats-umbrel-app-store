releaseNotes: >-
  Terminus Pool v0.2.11 adds a private, read-only Umbrel admin dashboard for viewing
  every miner account represented in the RATUM payout window, with masked identities,
  hashrate, window share, best share, projected payout, and payout status. The public
  website and API remain aggregate-only, and all three mining lanes are preserved.
