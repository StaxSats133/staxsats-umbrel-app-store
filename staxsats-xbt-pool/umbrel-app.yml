id: staxsats-xbt-pool
name: Terminus Pool
tagline: The last word in mining
icon: https://raw.githubusercontent.com/StaxSats133/staxsats-umbrel-app-store/main/staxsats-xbt-pool/icon.svg
category: bitcoin
version: "0.2.41"
port: 8081
description: >-
  Terminus Pool is an XBT BLAKE2b mining pool dashboard for RATUM Prime and DATUM.
  It provides live pool telemetry, rolling hashrate, miner accounting, payout-window data,
  best-share tracking, public DATUM connection details,
  and block status in a responsive cyberpunk interface.
developer: StaxSats133
website: https://terminuspool.xyz
submitter: StaxSats133
