releaseNotes: >-
  Terminus Pool v0.2.15 adds durable per-account all-time best-share tracking to the
  private miner admin. Current-window best share remains sourced directly from RATUM,
  while tracked maxima persist across payout-window resets and dashboard restarts in
  the existing local SQLite state. Public telemetry and mining behavior are unchanged.
