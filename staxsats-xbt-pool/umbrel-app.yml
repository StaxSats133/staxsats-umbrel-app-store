releaseNotes: >-
  Terminus Pool v0.2.16 adds a privacy-safe public leaderboard for miner accounts
  observed hashing during the rolling last 24 hours. Rankings use 24-hour average
  hashrate, payout addresses are replaced by opaque aliases, and buffered live/recent/
  seen states prevent display flicker. Worker tags now use durable 24-hour consensus
  with hysteresis, fixing upstream tag changes in admin and miner lookup views.
