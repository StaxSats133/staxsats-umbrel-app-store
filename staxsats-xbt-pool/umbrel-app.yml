repo: https://github.com/StaxSats133/staxsats-umbrel-app-store
support: https://github.com/StaxSats133/staxsats-umbrel-app-store/issues
gallery: []
releaseNotes: >-
  Terminus Pool v0.2.41 replaces the capped payout-window share count with an
  estimated shares-since-block metric tied to the durable block-effort cycle.
  It resets only when Terminus finds a real block and is explicitly labeled as
  an estimate because RATUM does not expose a monotonic accepted-share total.
