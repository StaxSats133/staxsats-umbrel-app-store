version: '3.7'

services:
  app_proxy:
    environment:
      APP_HOST: staxsats-xbt-pool-dashboard
      APP_PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - umbrel_main_network
    container_name: staxsats-xbt-pool_app_proxy_1

  dashboard:
    image: python:3.12-alpine
    restart: unless-stopped
    command: ["python3", "/app/server.py"]
    volumes:
      - ${APP_DATA_DIR}/data/server.py:/app/server.py:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - umbrel_main_network
    container_name: staxsats-xbt-pool-dashboard

networks:
  umbrel_main_network:
    external: true
